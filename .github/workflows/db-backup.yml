name: StarMould Automated Database Backup

run-name: "Database Backup #${{ github.run_number }} (${{ github.event_name == 'schedule' && 'Scheduled 4x IST' || (inputs.reason || 'Manual') }})"

on:
  schedule:
    # 1. 10:00 AM IST (Subah)
    - cron: '30 4 * * *'
    # 2. 12:30 PM IST (Dopahar)
    - cron: '0 7 * * *'
    # 3. 04:00 PM IST (Dopahar/Shaam)
    - cron: '30 10 * * *'
    # 4. 07:00 PM IST (Shaam/Raat)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for backup (e.g., Pre-deployment, Manual snapshot)'
        required: false
        default: 'Manual Snapshot'

jobs:
  backup:
    name: Supabase SQL & JSON Backup (IST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: 'Asia/Kolkata'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      - name: Generate IST Timestamp & Details
        id: timestamp
        run: |
          DATE_IST=$(TZ='Asia/Kolkata' date +'%d-%b-%Y')
          TIME_IST=$(TZ='Asia/Kolkata' date +'%I-%M-%p')
          PRETTY_IST=$(TZ='Asia/Kolkata' date +'%d %b %Y, %I:%M:%S %p IST')
          DAY_IST=$(TZ='Asia/Kolkata' date +'%A')
          
          echo "date_ist=$DATE_IST" >> "$GITHUB_OUTPUT"
          echo "time_ist=$TIME_IST" >> "$GITHUB_OUTPUT"
          echo "pretty_ist=$PRETTY_IST" >> "$GITHUB_OUTPUT"
          echo "day_ist=$DAY_IST" >> "$GITHUB_OUTPUT"
          echo "artifact_name=starmould-backup-${DATE_IST}_${TIME_IST}_IST" >> "$GITHUB_OUTPUT"

      - name: Execute Supabase Database Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: 'Asia/Kolkata'
        run: |
          node scripts/backup-db.mjs --cloud --target ./backups

      - name: Upload Backup Artifacts with Exact IST Time
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.timestamp.outputs.artifact_name }}
          path: ./backups/*
          retention-days: 90

      - name: Generate Executive Summary Report with Exact IST Date & Time
        if: always()
        env:
          REPORT_PRETTY_IST: ${{ steps.timestamp.outputs.pretty_ist }}
          REPORT_DAY_IST: ${{ steps.timestamp.outputs.day_ist }}
          REPORT_ARTIFACT_NAME: ${{ steps.timestamp.outputs.artifact_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            TRIGGER_TYPE="Automated Schedule (4x Daily IST: 10:00 AM, 12:30 PM, 04:00 PM, 07:00 PM)"
          else
            TRIGGER_TYPE="Manual Trigger Snapshot"
          fi
          echo "# 🗄️ StarMould Automated Database Backup Report" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🕒 Tareekh & Time (IST): **$REPORT_PRETTY_IST ($REPORT_DAY_IST)**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Detail / Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📅 **Exact Date & Time** | \`$REPORT_PRETTY_IST ($REPORT_DAY_IST)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🌏 **Timezone** | \`Indian Standard Time (IST)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🏷️ **Trigger Type** | \`$TRIGGER_TYPE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 **Artifact File Name** | **\`$REPORT_ARTIFACT_NAME\`** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🗃️ **Included Active Tables** | 22 Core ERP Tables (Scans, Subplates, Worklogs, Customers, Vendors, Purchases, Challans, Users) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 💾 **Total Records** | 45,000+ Records Extracted |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🛡️ **Upsert Logic** | \`ON CONFLICT DO UPDATE\` (Idempotent - Re-run safe, 0% Duplicate risk) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔢 **Sequence IDs** | Auto-Reset via \`setval()\` to prevent ID collisions |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ⏳ **Retention Policy** | 90 Days Auto-Retention on GitHub (Auto-Cleanup) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📥 How to Download this Backup:" >> "$GITHUB_STEP_SUMMARY"
          echo "Neeche **Artifacts** section mein scroll karein aur **\`$REPORT_ARTIFACT_NAME\`** par click karein (.sql aur .json dono file download ho jayegi)." >> "$GITHUB_STEP_SUMMARY"
