name: StarMould Automated Database Backup
run-name: Database Backup ${{ github.run_number }} (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Database environment
        type: choice
        options: [production, staging]
        default: production
      reason:
        description: Reason for manual snapshot
        required: false
        default: Manual Snapshot

permissions:
  contents: read

jobs:
  backup:
    name: Capture and verify database backup
    environment: ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    container: postgres:17-bookworm
    timeout-minutes: 20
    concurrency:
      group: database-backup-${{ github.event.schedule || github.run_id }}
      cancel-in-progress: false
    env:
      TZ: Asia/Kolkata
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_CONTROL_DATABASE_URL: ${{ secrets.BACKUP_CONTROL_DATABASE_URL }}
      BACKUP_DUMP_DATABASE_URL: ${{ secrets.BACKUP_DUMP_DATABASE_URL }}
      BACKUP_DATABASE_CA: ${{ secrets.BACKUP_DATABASE_CA }}
      BACKUP_R2_ACCOUNT_ID: ${{ secrets.BACKUP_R2_ACCOUNT_ID }}
      BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      BACKUP_R2_PREFIX: ${{ vars.BACKUP_R2_PREFIX || 'database' }}
      BACKUP_SCHEMAS: ${{ vars.BACKUP_SCHEMAS || 'public' }}
      NODE_PATH: ${{ github.workspace }}/automation/db-backup-service/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/db-backup-service/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix automation/db-backup-service --omit=dev --ignore-scripts
      - name: Configure verified database TLS
        if: vars.BACKUP_AUTOMATION_ENABLED == 'true'
        shell: bash
        run: |
          node scripts/backup/certificates.cjs "$RUNNER_TEMP/backup-ca.crt"
          echo "BACKUP_DATABASE_CA_FILE=$RUNNER_TEMP/backup-ca.crt" >> "$GITHUB_ENV"
          echo "BACKUP_PGSSLROOTCERT=$RUNNER_TEMP/backup-ca.crt" >> "$GITHUB_ENV"
      - name: Capture backup
        env:
          AUTOMATION_ENABLED: ${{ vars.BACKUP_AUTOMATION_ENABLED }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTOMATION_ENABLED" != "true" ]; then
            echo 'Backup automation must be enabled.'
            exit 1
          fi
          case "$SCHEDULE" in
            '35 4 * * *') SLOT=morning ;;
            '5 7 * * *'|'05 7 * * *') SLOT=midday ;;
            '35 10 * * *') SLOT=afternoon ;;
            '35 13 * * *') SLOT=evening ;;
            '') SLOT='' ;;
            *) echo 'Unknown backup schedule'; exit 1 ;;
          esac
          node scripts/backup/cli.cjs primary "$SLOT"
      - name: Upload SQL backup to GitHub Actions
        if: vars.BACKUP_AUTOMATION_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: starmould-sql-backup-${{ github.run_id }}
          path: ./backups/*.sql
          if-no-files-found: ignore
          retention-days: 7
